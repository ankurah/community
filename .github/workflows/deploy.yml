name: Deploy

# The durable Community server runs as one GKE pod. This workflow builds the
# exact successful main commit, publishes an immutable image, and deploys that
# digest through a namespace-limited identity. The old Cloud Run target is
# intentionally gone; COMMUNITY_DEPLOY_TARGET must explicitly equal `gke`.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: community-production-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  GCP_PROJECT_ID: ${{ vars.GKE_GCP_PROJECT_ID || 'synesthetic-1' }}
  GCP_REGION: ${{ vars.GKE_GCP_REGION || 'us-west1' }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER || 'kube-1' }}
  ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.GKE_ARTIFACT_REGISTRY_REPOSITORY || 'ankurah-community' }}

jobs:
  deploy:
    name: Build and deploy to GKE
    runs-on: ubuntu-latest
    if: >-
      ${{
        (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
        vars.COMMUNITY_DEPLOY_TARGET == 'gke' &&
        vars.GKE_GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
        vars.GKE_GCP_IMAGE_PUBLISHER_SERVICE_ACCOUNT != '' &&
        vars.GKE_GCP_DEPLOY_SERVICE_ACCOUNT != ''
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify deploy commit belongs to main
        run: |
          if [[ ! "${DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "DEPLOY_SHA must be a full lowercase 40-character Git commit SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${DEPLOY_SHA}"
          git merge-base --is-ancestor "${DEPLOY_SHA}" origin/main

      - name: Authenticate for image publishing
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GKE_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GKE_GCP_IMAGE_PUBLISHER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Resolve immutable image
        id: image
        run: |
          name="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/community-server"
          digest="$(gcloud artifacts docker images describe \
            "${name}:${DEPLOY_SHA}" \
            --project="${GCP_PROJECT_ID}" \
            --format='value(image_summary.digest)' 2>/dev/null || true)"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          if [ -n "${digest}" ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push image
        if: ${{ steps.image.outputs.exists != 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=community-server
          cache-to: type=gha,mode=max,scope=community-server

      - name: Confirm published digest
        id: published
        run: |
          digest="$(gcloud artifacts docker images describe \
            "${{ steps.image.outputs.name }}:${DEPLOY_SHA}" \
            --project="${GCP_PROJECT_ID}" \
            --format='value(image_summary.digest)')"
          test -n "${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate for GKE deployment
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GKE_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GKE_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@64bc7249bbcf78056bb92f14d3cedc2da193946c # v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          use_dns_based_endpoint: true

      - name: Apply runtime resources
        run: |
          kubectl apply -f infra/gke/network-policy.yaml
          kubectl apply -f infra/gke/service-account.yaml
          kubectl apply -f infra/gke/secret-sync-service-account.yaml
          kubectl apply -f infra/gke/secrets.yaml
          kubectl apply -f infra/gke/service.yaml

          kubectl wait \
            --for=condition=Update=True \
            secretsync/community-runtime-secrets \
            --namespace=community \
            --timeout=2m

          # `kubectl wait` can observe the previous Update=True condition while
          # the controller is still reconciling a newly expanded SecretSync.
          # Check only for key PRESENCE (never values) before a pod may consume
          # the Secret. This also covers a first deployment into a new cluster.
          runtime_secret_ready=false
          for _ in {1..60}; do
            if [ "$(kubectl get secret/community-runtime-secrets \
              --namespace=community \
              --output=go-template='{{if and (index .data "DATABASE_URL") (index .data "ANKURAH_JWT_SIGNING_KEY") (index .data "CI_HOOK_SECRET") (index .data "APNS_KEY_P8") (index .data "APNS_KEY_ID")}}ready{{end}}')" = ready ]; then
              runtime_secret_ready=true
              break
            fi
            sleep 2
          done
          test "${runtime_secret_ready}" = true
          runtime_secret_version="$(kubectl get secret/community-runtime-secrets \
            --namespace=community \
            --output=jsonpath='{.metadata.resourceVersion}')"
          test -n "${runtime_secret_version}"

          kubectl set image \
            --local \
            --filename=infra/gke/deployment.yaml \
            --output=yaml \
            community-web="${{ steps.image.outputs.name }}@${{ steps.published.outputs.digest }}" \
            | kubectl patch \
                --local \
                --filename=- \
                --output=yaml \
                --type=merge \
                --patch="{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"community.ankurah.org/runtime-secret-version\":\"${runtime_secret_version}\"}}}}}" \
            | kubectl apply -f -

          kubectl rollout status deployment/community-web \
            --namespace=community \
            --timeout=5m

      - name: Report GKE status
        if: ${{ always() }}
        run: |
          kubectl get deployment,pods,service --namespace=community -o wide || true
          kubectl get svcneg --namespace=community || true
          kubectl describe deployment/community-web --namespace=community || true
          kubectl logs deployment/community-web --namespace=community --all-containers --tail=100 || true
