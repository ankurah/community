name: Deploy

# Builds one container (durable node + SPA) and deploys it to Cloud Run.
# Runs after CI succeeds on main, or on manual dispatch. Authenticates to GCP
# via Workload Identity Federation — no long-lived service-account keys.
#
# Required repo variables (Settings → Actions → Variables) — see docs/deploy.md:
#   GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER,
#   GCP_DEPLOY_SERVICE_ACCOUNT, ARTIFACT_REGISTRY_REPOSITORY, CLOUD_RUN_SERVICE,
#   CLOUD_RUN_SERVICE_ACCOUNT, CLOUD_SQL_INSTANCE_CONNECTION_NAME,
#   DATABASE_URL_SECRET, JWT_SIGNING_KEY_SECRET, SMOKE_BASE_URL
# Optional repo variable:
#   CI_HOOK_SECRET_NAME — the Secret Manager secret holding the shared HMAC key
#   for POST /hooks/ci (#66). Left unset, this deploy simply does not mount it
#   and the endpoint answers 503; nothing else changes.
#
#   Turning the channel on means putting ONE value in two places: Secret Manager
#   here, and the COMMUNITY_CI_HOOK_SECRET Actions secret on ankurah/ankurah,
#   whose reporter workflow signs each delivery with it. Both sides must hold
#   the same bytes or every delivery 401s — so generate it once, into a shell
#   variable, and set both from that variable before discarding it:
#     secret=$(openssl rand -hex 32)
#     printf '%s' "${secret}" | gcloud secrets create community-ci-hook-secret \
#       --project ankurah-community --data-file=-
#     printf '%s' "${secret}" | gh secret set COMMUNITY_CI_HOOK_SECRET --repo ankurah/ankurah
#     unset secret
#   Then let the runtime service account read it, and point this deploy at it:
#     gcloud secrets add-iam-policy-binding community-ci-hook-secret \
#       --project ankurah-community \
#       --member serviceAccount:community-runtime@ankurah-community.iam.gserviceaccount.com \
#       --role roles/secretmanager.secretAccessor
#     gh variable set CI_HOOK_SECRET_NAME --repo ankurah/community --body community-ci-hook-secret
#   The accessor grant is not optional: without it the revision fails to start
#   rather than falling back to the closed endpoint. Skipping the `gh secret
#   set` fails quietly instead — the reporter finds no secret, logs a warning,
#   and every run silently reports nothing.
# Secret Manager secrets the runtime SA must be able to access:
#   community-database-url, community-jwt-signing-key (RS256 key that mints
#   the ankurah session tokens issued by /auth/session), and — once configured —
#   community-ci-hook-secret.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY || 'community' }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'community' }}
  CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_SERVICE_ACCOUNT || '' }}
  DATABASE_URL_SECRET: ${{ vars.DATABASE_URL_SECRET || 'community-database-url' }}
  JWT_SIGNING_KEY_SECRET: ${{ vars.JWT_SIGNING_KEY_SECRET || 'community-jwt-signing-key' }}
  CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME || '' }}
  CI_HOOK_SECRET_NAME: ${{ vars.CI_HOOK_SECRET_NAME || '' }}
  SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL || '' }}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Generate image tag
        id: image
        run: |
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/community-server:${DEPLOY_SHA}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha,scope=community-server
          cache-to: type=gha,mode=max,scope=community-server

      - name: Deploy to Cloud Run
        run: |
          # The CI webhook secret is mounted only once CI_HOOK_SECRET_NAME
          # names a Secret Manager secret. Naming one that does not exist would
          # fail the deploy, so an unset variable must leave the flag alone —
          # the server treats an absent CI_HOOK_SECRET as "endpoint closed".
          secrets="DATABASE_URL=${DATABASE_URL_SECRET}:latest,ANKURAH_JWT_SIGNING_KEY=${JWT_SIGNING_KEY_SECRET}:latest"
          if [ -n "${CI_HOOK_SECRET_NAME}" ]; then
            secrets="${secrets},CI_HOOK_SECRET=${CI_HOOK_SECRET_NAME}:latest"
          fi

          # Durable node: a single instance keeps in-memory state coherent
          # (--max-instances 1), and one instance is always warm
          # (--min-instances 1). The floor is what keeps the first visitor after
          # an idle stretch from paying for the whole boot — loading the sled/
          # postgres node, seeding rooms, starting the workers — which is a
          # multi-second wait landing on exactly the arrival that matters most.
          # It costs an always-on instance's CPU/memory allocation.
          args=(
            run deploy "${CLOUD_RUN_SERVICE}"
            --project "${GCP_PROJECT_ID}"
            --region "${GCP_REGION}"
            --platform managed
            --image "${{ steps.image.outputs.image }}"
            --port 8080
            --cpu 1
            --memory 512Mi
            --concurrency 40
            --min-instances 1
            --max-instances 1
            --timeout 900
            --no-invoker-iam-check
            --set-secrets "${secrets}"
            --quiet
          )
          if [ -n "${CLOUD_SQL_INSTANCE_CONNECTION_NAME}" ]; then
            args+=(--add-cloudsql-instances "${CLOUD_SQL_INSTANCE_CONNECTION_NAME}")
          fi
          if [ -n "${CLOUD_RUN_SERVICE_ACCOUNT}" ]; then
            args+=(--service-account "${CLOUD_RUN_SERVICE_ACCOUNT}")
          fi
          gcloud "${args[@]}"

      - name: Smoke health check
        if: ${{ env.SMOKE_BASE_URL != '' }}
        run: curl --fail --show-error --silent "${SMOKE_BASE_URL}/health"
