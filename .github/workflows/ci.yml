name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # Pinned: this job gates production deploys, and the e2e suite now runs
      # live specs through trunk's proxy table — a floating trunk could change
      # serving or proxy behavior under the gate with no repository change.
      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14

      - name: Build server (release)
        run: cargo build -p community-server --release --locked

      - name: Test server & model
        run: cargo test -p community-server -p community-model --release --locked

      # The sled-gated tests — the CI webhook's end-to-end route proof, the
      # worker tests, the model-pin tests, the OR-of-Refs live-scope tests —
      # compile to nothing under the default (postgres) feature set. Without
      # this step they were written but never run on a pull request. They need
      # a second invocation rather than an added feature: sled and postgres are
      # alternative storage engines, and `main` picks one at compile time.
      - name: Test server (sled storage)
        run: cargo test -p community-server --no-default-features --features sled --release --locked

      - name: Build SPA (release)
        working-directory: leptos-app
        run: trunk build --release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm ci` against the committed lockfile: the live specs gate deploys,
      # so a new Playwright (or its bundled Chromium) must arrive by a commit
      # that bumps the lockfile, never by the gate re-resolving `^1.57.0`.
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright
        working-directory: e2e
        run: npx playwright install chromium

      - name: Run e2e tests
        working-directory: e2e
        run: npm run test:e2e
        env:
          CI: true

# The quality gates (clippy, dependency advisories, SPA unit tests) live in
# quality.yml, deliberately OUTSIDE this workflow: deploy.yml triggers on this
# workflow's success, and two of those gates can turn red on `main` with no
# commit (a new stable's added lints under -D warnings; a freshly filed
# advisory arriving over the network). Keeping them out of `CI` keeps a
# production fix deployable while an unrelated gate is red.
