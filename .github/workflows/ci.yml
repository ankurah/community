name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PINNED, and load-bearing rather than hygiene: rustc 1.97's v0
      # symbol-mangling default makes wasm-bindgen =0.2.105 (the repo's pinned
      # family) emit DUPLICATE closure-converter declarations into the JS glue
      # — a SyntaxError that kills the SPA at load (wasm-bindgen#4820). Every
      # trunk build this job made on a newer stable produced that dead
      # artifact; the e2e guest suite was the first thing to ever execute one
      # and caught it. 1.95 predates the mangling default; the production
      # Dockerfile is separately safe on rust:1.88. RETIRE this pin when the
      # wasm-bindgen family moves past the upstream fix (#4818/#4822,
      # releases ≥ 0.2.12x) — a harness task tracks that bump and the
      # leptos-compat validation the family pin exists for.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # Pinned: this job gates production deploys, and the e2e suite now runs
      # live specs through trunk's proxy table — a floating trunk could change
      # serving or proxy behavior under the gate with no repository change.
      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14

      - name: Build server (release)
        run: cargo build -p community-server --release --locked

      - name: Test server & model
        run: cargo test -p community-server -p community-model --release --locked

      # The sled-gated tests — the CI webhook's end-to-end route proof, the
      # worker tests, the model-pin tests, the OR-of-Refs live-scope tests —
      # compile to nothing under the default (postgres) feature set. Without
      # this step they were written but never run on a pull request. They need
      # a second invocation rather than an added feature: sled and postgres are
      # alternative storage engines, and `main` picks one at compile time.
      - name: Test server (sled storage)
        run: cargo test -p community-server --no-default-features --features sled --release --locked

      - name: Build SPA (release)
        working-directory: leptos-app
        run: trunk build --release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm ci` against the committed lockfile: the live specs gate deploys,
      # so a new Playwright (or its bundled Chromium) must arrive by a commit
      # that bumps the lockfile, never by the gate re-resolving `^1.57.0`.
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright
        working-directory: e2e
        run: npx playwright install chromium

      - name: Run e2e tests
        working-directory: e2e
        run: npm run test:e2e
        env:
          CI: true

      # A red e2e run leaves its evidence (traces from `on-first-retry`,
      # screenshots) in test-results/ and the runner then throws the runner
      # away — upload it, or every CI-only failure is diagnosed blind.
      - name: Upload e2e evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

# The quality gates (clippy, dependency advisories, SPA unit tests) live in
# quality.yml, deliberately OUTSIDE this workflow: deploy.yml triggers on this
# workflow's success, and two of those gates can turn red on `main` with no
# commit (a new stable's added lints under -D warnings; a freshly filed
# advisory arriving over the network). Keeping them out of `CI` keeps a
# production fix deployable while an unrelated gate is red.
