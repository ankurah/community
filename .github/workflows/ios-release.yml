# Build the iOS shell and upload it to TestFlight.
#
# Dispatch-only: releases are a deliberate act, and the signing material in
# repo secrets must never be reachable from fork-triggered events. Promotion
# from TestFlight to App Store review is a human action in App Store Connect.
#
# Needs (see ~/ak/community-artifacts/mobile-appstore-setup-for-daniel.md —
# all created and entered by Daniel):
#   secrets: ASC_API_KEY_P8, ASC_API_KEY_ID, ASC_API_ISSUER_ID,
#            IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD,
#            IOS_PROVISIONING_PROFILE_BASE64
#   variables: APPLE_TEAM_ID
name: iOS Release

on:
  workflow_dispatch:

# Nothing here writes to the repository: the job builds, signs and hands the
# archive to App Store Connect, which it authenticates to with its own API key.
# Stated rather than inherited, because the default for a workflow that names no
# permissions is whatever the repository's default is — and a token wider than
# the job needs is a token every action in the job could use.
permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (wasm)
        run: rustup target add wasm32-unknown-unknown

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the web client for the shell
        # The compile-time override points both transports at production —
        # ws_url() takes it verbatim, server_http_base() maps it to https.
        run: |
          cd leptos-app
          BACKEND_WS_URL=wss://community.ankurah.org trunk build --release

      - name: Stage assets and sync the iOS project
        run: |
          cd mobile
          npm ci
          rm -rf www && cp -R ../leptos-app/dist www
          npx cap sync ios

      - name: Import signing material
        # A throwaway keychain holds the distribution certificate for this
        # job only; the provisioning profile goes where xcodebuild looks.
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/dist.p12
          # -A trusts every application on this runner with the key, which
          # is what a throwaway keychain in a single-job VM can afford. -T
          # names codesign explicitly alongside it: the partition list set
          # below is what actually decides, and an entry for the one tool that
          # must reach the key is what keeps this working if -A is ever
          # narrowed.
          security import $RUNNER_TEMP/dist.p12 -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -A -T /usr/bin/codesign -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/community.mobileprovision"

      - name: Archive
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project mobile/ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Ankurah Community App Store" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Upload to TestFlight
        # xcodebuild uploads the archive itself when the export options say
        # destination=upload, authenticating with the App Store Connect API
        # key — no third-party upload tooling involved.
        env:
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          cat > $RUNNER_TEMP/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict><key>org.ankurah.community</key>
                  <string>Ankurah Community App Store</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -exportPath $RUNNER_TEMP/export \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
