[package]
name = "community-model"
version = "0.6.0"
edition = "2021"
publish = false

[features]
default = []
# Leptos uses ankurah-signals' reactive-graph integration, NOT the React JS
# bindings — so forward only ankurah/wasm here (ankurah/react would pull in
# ankurah-signals' `#[wasm_bindgen(module = "react")]` glue and break the app).
wasm = ["dep:wasm-bindgen", "ankurah/wasm"]

[dependencies]
ankurah = { version = "=0.9.0", features = ["derive"] }
# The collections community shares with every other Ankurah chat surface —
# Message, Room, User, Reaction, ReadState, the DM trio — and the mention/URL
# scanner. They live there rather than here so the scanner's caps, which the
# server and the client must agree on byte-for-byte, have exactly one
# definition no matter how many apps read this data. Re-exported from lib.rs.
#
# Pinned to an exact rev, not a branch: this crate's structs ARE the wire
# format of live rows, so what community compiles against must be a fixed
# tree, chosen deliberately. Not on crates.io yet — publishing waits until the
# API stops moving under dogfooding.
ankurah-chat-model = { git = "https://github.com/ankurah/ankurah-chat", rev = "550b596fe71ba3e8d5eaee37340e0e1d1e58b890" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = { version = "0.2", optional = true }

##### patch - something is wrong with the uuid crate for wasm
getrandom = { version = "0.3", features = ["wasm_js"] }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
######

tracing = { version = "0.1" }
