apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: community-runtime-secrets
  namespace: community
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/synesthetic-1/secrets/ankurah-community-database-url/versions/latest"
        path: "DATABASE_URL"
      - resourceName: "projects/synesthetic-1/secrets/community-jwt-signing-key/versions/latest"
        path: "ANKURAH_JWT_SIGNING_KEY"
      - resourceName: "projects/synesthetic-1/secrets/community-ci-hook-secret/versions/latest"
        path: "CI_HOOK_SECRET"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: community-runtime-secrets
  namespace: community
spec:
  serviceAccountName: community-secret-sync
  secretProviderClassName: community-runtime-secrets
  secretObject:
    type: Opaque
    data:
      - sourcePath: "DATABASE_URL"
        targetKey: "DATABASE_URL"
      - sourcePath: "ANKURAH_JWT_SIGNING_KEY"
        targetKey: "ANKURAH_JWT_SIGNING_KEY"
      - sourcePath: "CI_HOOK_SECRET"
        targetKey: "CI_HOOK_SECRET"
