apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: community
  labels:
    app.kubernetes.io/part-of: ankurah-community
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-community-load-balancer
  namespace: community
  labels:
    app.kubernetes.io/part-of: ankurah-community
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: community-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 130.211.0.0/22
        - ipBlock:
            cidr: 35.191.0.0/16
      ports:
        - protocol: TCP
          port: 8080
