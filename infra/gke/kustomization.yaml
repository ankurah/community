apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - network-policy.yaml
  - service-account.yaml
  - secret-sync-service-account.yaml
  - secrets.yaml
  - service.yaml

# deployment.yaml is deliberately excluded. CI renders its fail-closed image
# sentinel to a verified immutable digest before applying it.
