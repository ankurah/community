[package]
name = "community-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ankurah = { version = "=0.9.2" }
ankurah-websocket-server = { version = "=0.9.2" }
ankurah-storage-sled = { version = "=0.9.2", optional = true }
ankurah-storage-postgres = { version = "=0.9.2", optional = true }
# JWT policy agent. `watcher` is required (not just for hot-reload): it publishes
# the policy + verifying public key into the `jwtpolicy` collection so ephemeral
# clients can sync it — without it the client's local policy is deny-all.
ankurah-jwt-auth = { version = "=0.9.2", features = ["watcher"] }
community-model = { path = "../model" }

anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
# CI webhook (POST /hooks/ci): HMAC-SHA256 over the raw request body, with the
# tag carried as base64 (svix header convention). All three crates are already
# in the build transitively (jsonwebtoken pulls hmac+sha2, ankurah pulls
# base64); declared here because ci_hook.rs uses them directly.
# `hmac::Mac::verify_slice` performs the constant-time tag comparison — a
# signature must never be checked with `==`.
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
# Worker supervision: catch_unwind on the consumer futures so a panic inside
# one respawns it instead of silently killing derived-data production.
# Already in the build transitively (axum/ankurah); declared for direct use.
futures-util = "0.3"
# `sync`/`time` back the workers' channels and fetch budgets (already in the
# build transitively via ankurah/reqwest; declared because we use them directly).
tokio = { version = "1.38", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# OIDC: validate idp.to ID tokens (RS256 via JWKS) and fetch the JWKS.
# reqwest is rustls-only (no openssl) and doubles as the unfurl worker's
# HTTP client; `url` is reqwest's own URL type (same crate, zero new code)
# taken directly so the SSRF guard can match on url::Host.
# The CVE-2026-25537 fix (a wrong-JSON-typed `exp`/`nbf` treated as absent
# rather than invalid, voiding `validate_nbf` for exactly the malformed tokens
# it should catch) landed in 10.3. We take the current major (11) rather than
# stop at that floor: once a CVE forces a bump, a major boundary is not a reason
# to hold back on an older line. 11.0 touches none of our surface (we use
# `Algorithm::RS256` as a value, not the now-`non_exhaustive` match, and none of
# the reworked JWK / key / header APIs). The `rust_crypto` backend (mandatory
# to choose since v10) keeps the build pure-Rust: aws_lc_rs would add a second,
# native crypto stack beside ring.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2"

[features]
# Storage engine for the durable (server) node. `cargo generate` sets `default`
# to your choice (Sled or Postgres); dev.sh reads it back to decide whether to
# bring up a Postgres container. Change the default here to switch engines.
default = ["postgres"]
sled = ["dep:ankurah-storage-sled"]
postgres = ["dep:ankurah-storage-postgres"]
