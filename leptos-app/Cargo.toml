[package]
name = "leptos-app"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8.12", features = ["csr"] }
console_error_panic_hook = "0.1"
ankurah = { version = "=0.9.2", features = ["derive", "wasm"] }
community-model = { path = "../model", features = ["wasm"] }
# The chat surfaces themselves: the room selector, the room log with its
# timeline and composer, and the direct-message views. Community is the
# reference embedder — it hands the components a signal of its session (the
# ankurah Context and who is reading through it) and layers its own chrome
# (header, panels, moderation, notifications, x-ray) on top.
#
# Pinned to the same rev as ankurah-chat-model above, and for the same reason:
# these crates are one tree, and a components rev that disagreed with the model
# rev would resolve two copies of the collections.
ankurah-chat-leptos = { git = "https://github.com/ankurah/ankurah-chat", rev = "4ab7713be04b390c54e789a597527898aaecd90b" }
ankurah-storage-indexeddb-wasm = "=0.9.2"
ankurah-signals = { version = "=0.9.2", features = ["reactive-graph"] }
# JWT auth on wasm: client only calls parse_claims_unverified + JwtContext::from_claims
# (pure-rust crypto; never generates/signs). No features needed on wasm.
ankurah-jwt-auth = "=0.9.2"
wasm-bindgen-futures = "=0.4.55"
ankurah-websocket-client-wasm = "=0.9.2"
web-sys = { version = "=0.3.82", features = [
    "Window", "Location", "UrlSearchParams", "Url", "History", "Element", "DomRect", "Node", "NodeList", "EventTarget", "HtmlElement", "Storage",
    "AudioContext", "AudioBuffer", "AudioBufferSourceNode", "GainNode", "AudioParam", "AudioNode",
    "AudioDestinationNode", "AudioContextState", "Response", "Document",
    "Request", "RequestInit", "Headers", "RequestMode",
    # X-ray node card: raw IndexedDB entity/event counts (no ankurah storage-stats API yet).
    "Event", "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbDatabase", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore",
    # X-ray's own affordances over the chat components: a delegated click
    # listener, and a MutationObserver watching for bubbles as they mount.
    "MutationObserver", "MutationObserverInit", "MutationRecord", "DomTokenList",
    # The framed sign-in ceremony: the result the callback frame posts to the
    # page that framed it arrives as a MessageEvent, Escape closes the modal
    # through a KeyboardEvent listener, and the × is held in a typed NodeRef so
    # focus can move onto it at mount. Named here rather than borrowed from
    # whatever else in the graph happens to enable them — a dependency shuffle
    # would take that away without touching this file.
    "MessageEvent", "KeyboardEvent", "HtmlButtonElement",
    # The mobile shell asks the browser to keep this origin's storage rather
    # than evict it (shell.rs): inside the app that IndexedDB store is the
    # member's history, not a cache of a site they visited.
    "Navigator", "StorageManager",
] }
js-sys = "=0.3.82"
tracing-wasm = "0.2.1"
tracing = "0.1.41"
lazy_static = "1.5.0"
send_wrapper = "0.6.0"
# Pin the wasm-bindgen family to a set compatible with ankurah-signals 0.9.0
# (newer wasm-bindgen breaks its build); Cargo.lock is gitignored so generated
# projects resolve fresh and would otherwise pick an incompatible version.
wasm-bindgen = "=0.2.105"
qrcode = "0.14.1"
# X-ray inspector: decode ankurah's yrs backend diffs (encode_diff_v2) into
# "+n/−n" summaries. Pinned to the exact version ankurah-core 0.9.0 resolves
# to (see Cargo.lock) so the graph carries a single yrs copy — no skew.
yrs = "=0.24.0"

# PKCE (S256) + parsing small OIDC/session JSON responses on the client.
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

##### wasm: force the "js" RNG backend for getrandom 0.2 (pulled transitively via
##### ankurah's rand 0.8).
#####
##### The 0.3 line is here for the same reason, plus one of its own. It is in
##### the wasm graph regardless (the ankurah wasm crates, community-model, and
##### yrs's fastrand all pull it), and .cargo/config.toml sets
##### `getrandom_backend="wasm_js"` for it — a cfg that getrandom 0.3 turns into
##### a hard compile_error unless the `wasm_js` FEATURE is on too. Today four
##### dependencies happen to enable that feature; declaring it here means the
##### build no longer rests on their continuing to.
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
#####
